name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -s "docs/releases/$RELEASE_TAG.md"
      - name: Test port discovery and process controls
        run: ./scripts/test.sh
      - name: Package DMG and ZIP
        run: ./scripts/package-macos.sh
      - name: Verify release artifacts
        run: |
          codesign --verify --deep --strict 'dist/端口管家.app'
          cd dist
          shasum -a 256 -c "PortManager-$(cat ../VERSION)-mac-arm64.dmg.sha256"
          shasum -a 256 -c PortManager.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/PortManager-*-mac-arm64.dmg
            dist/PortManager-*-mac-arm64.dmg.sha256
            dist/PortManager.zip
            dist/PortManager.zip.sha256
          if-no-files-found: error

  windows:
    name: Build Windows preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version and release notes
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match VERSION.' }
          if (-not (Test-Path "docs/releases/$($env:RELEASE_TAG).md")) { throw 'Release notes are missing.' }
      - name: Build, test and package Windows application
        shell: powershell
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/windows/PortManager-*-win-x64.exe
            dist/windows/PortManager-*-win-x64.exe.sha256
            dist/windows/PortManager-*-win-x64.zip
            dist/windows/PortManager-*-win-x64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish both platforms
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and asset count
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum -c ./*.sha256
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "端口管家 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            release-assets/*
