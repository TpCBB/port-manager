name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -s "docs/releases/$RELEASE_TAG.md"
      - name: Test port discovery and process controls
        run: ./scripts/test.sh
      - name: Package DMG and ZIP
        run: ./scripts/package-macos.sh
      - name: Verify release artifacts
        run: |
          codesign --verify --deep --strict 'dist/端口管家.app'
          cd dist
          shasum -a 256 -c "PortManager-$(cat ../VERSION)-mac-arm64.dmg.sha256"
          shasum -a 256 -c PortManager.zip.sha256
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "端口管家 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "dist/PortManager-$(cat VERSION)-mac-arm64.dmg" \
            "dist/PortManager-$(cat VERSION)-mac-arm64.dmg.sha256" \
            dist/PortManager.zip dist/PortManager.zip.sha256
