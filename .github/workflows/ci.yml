name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Check & build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:cloudflare

  check:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test port discovery and process controls
        run: ./scripts/test.sh
      - name: Build Apple Silicon app
        run: ./scripts/build.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict 'dist/端口管家.app'

  windows:
    name: Build and test Windows preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build, test and package Windows application
        shell: powershell
        run: .\scripts\package-windows.ps1
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: port-manager-windows-preview
          path: |
            dist/windows/PortManager-*-win-x64.exe
            dist/windows/PortManager-*-win-x64.exe.sha256
            dist/windows/PortManager-*-win-x64.zip
            dist/windows/PortManager-*-win-x64.zip.sha256
          if-no-files-found: error
